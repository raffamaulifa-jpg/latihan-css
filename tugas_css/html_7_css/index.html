<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Rafa Maulidan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Lesson 7</h1>

7A
<div class="box">
    <h2>7A. Rounded Corner Image</h2>
    <img src="UCING.png" class="img-a" style="width: 200px; border: 0; border-radius: 5px;">
</div>

7B
<div class="box">
    <h2>7B. Square Image</h2>
    <img src="UCING.png" class="img-b"  style="width: 5 00px; height: 500px; object-fit: cover;">
</div>

7C
<div class="box">
    <h2>7C. Circle Image</h2>
    <img src="UCING.png" class="img-c" style="border: 0; border-radius: 50%; width: 500px; height: 500px; object-fit: cover;">
</div>

7D
<div class="box">
    <h2>7D. Textbox Rounded</h2>
    <input type="text" placeholder="Search" class="search1">
</div>

7E
<div class="box">
    <h2>7E. Textbox Shadow</h2>
    <input type="text" placeholder="Search Google or type a URL" class="search2">
</div>

7F
<div class="linkedin-box">
    <h2>7F. LinkedIn Signup</h2>

    <p>Email</p>

    <input type="email" class="email">

    <p class="small">
        By clicking Agree & Join, you agree to the Privacy Policy.
    </p>

    <button class="join-btn">
        Agree & Join
    </button>
</div>

7G
<div class="box">
    <h2>7G. Twitter Text Box</h2>

    <div class="tweet-box">
        <img src="UCING.png" class="profile">

        <input type="text" placeholder="What's happening?" class="tweet-input">

        <button class="tweet-btn">
            Tweet
        </button>
    </div>
</div>

</body>
</html>
