<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Rafa Maulidan</title>
</head>
<body>
  <h1>3d html</h1>
   <style>
    button{
      width: 120px;
      padding: 10px;
      border-radius: 3px;
    }
    .start{
      border: 1px;
      border-style: solid;
      border-color: rgb(121, 82, 179);
      background-color: rgb(121, 82, 179);
      color: white;
    }
    .download{
      border: 1px;
      border-style: solid;
      color: rgb(108, 117, 125);
      background-color: white;
      border-color: rgb(108, 117, 125);
    }
    .start:hover{
      background-color: rgb(84, 37, 155);
      cursor: pointer;
    }
    .download:hover{
      background-color: rgb(180, 180, 180);
      color: white;
      cursor: pointer;
    }
  </style>
   <button class="start">Get started</button>
  <button class="download">Download</button>
  <br>

  <h1>3e html</h1>
   <style>
    button{
      border-radius: 25px;
      padding: 11px;
      font-family: tahoma;
      font-weight: bold;
    }
    .apply{
      border: 1px;
      border-color: rgb(10, 102, 194);
      border-style: solid;
      background-color: rgb(10, 102, 194);
      color: white;
    }
    .save{
      background-color: white;
      color: rgb(10, 102, 194);
      border: 1px;
      border-color: rgb(10, 102, 194);
      border-style: solid;
      width: 70px;
    }
    .apply:hover{
      background-color: rgb(2, 55, 107);
      cursor: pointer;
    }
    .save:hover{
      background-color: rgba(8, 100, 192, 0.336);
      cursor: pointer;
    }
  </style>
  <button class="apply">Apply on company website</button>
  <button class="save">Save</button>
  <br>

  <h1>3f html</h1>
    <style>
    a:hover{
      color: orange !important;
    }
    .add{
      color: black; 
      background-color: rgb(255, 216, 20); 
      border: 1px; 
      border-radius: 20px; 
      width: 100px; 
      padding: 5px; 
      cursor: pointer;
    }
    .buy{
      color: black; 
      background-color: rgb(255, 164, 28); 
      border: 1px; border-radius: 20px; 
      width: 100px; 
      padding: 5px; 
      cursor: pointer;
    }
    .add:focus{
      background-color: rgba(255, 216, 20, 0.7) !important;
    }
    .add:hover{
      background-color: rgb(196, 165, 14);
    }
    .buy:focus{
      background-color: rgba(255, 164, 28, 0.7) !important;
    }
    .buy:hover{
      background-color: rgb(209, 135, 23);
    }
  </style>

   <a href="https://www.amazon.com/" style="color: rgb(0, 113, 133);">Back to Amazon</a>
  <h1><b class="nike">Nike Black Running Shoes</b></h1>
  <p>
    <span style="color: rgb(0, 118, 0); font-weight: bold;">$39 - in stock.</span>
    <br>
    <br>
    Free delivery tomorrow.
  </p>
  <button class="add">Add to Cart</button>
  <button class="buy">Buy now</button>
</body>
</html>
